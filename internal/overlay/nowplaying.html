<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crow now playing</title>
<style>
  :root {
    /* Overridden from the settings the server pushes over SSE. */
    --art: 96px;
    --font: 20px;
    --panel: 0.45;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    /* A browser source composites over video: no background, no scrollbars. */
    background: transparent;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    box-sizing: border-box;
    /* Breathing room inside the browser source: the card's shadow needs somewhere
       to fall off, or it stops dead at the source edge. A 480x160 source fits the
       default 96px cover with this to spare. */
    padding: 16px;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    color: #fff;
  }

  #np {
    display: none;
    align-items: center;
    gap: 16px;
    width: 100%;
    box-sizing: border-box;
    /* A flex item defaults to min-width:auto, which lets a long title push the
       card wider than the browser source instead of being clipped by it — and
       then nothing ever overflows, so nothing ever scrolls. */
    min-width: 0;
    position: relative;
    isolation: isolate;
    font-size: var(--font);
    padding: 14px 18px 14px 14px;
    border-radius: 16px;
    /* No box-shadow and no border: both draw the card's exact rounded rectangle,
       and any hard outline around a panel that fades out at its edges puts the
       harsh line straight back. The panel layers below do all the blending. */
    transition: opacity 0.5s ease;
    /* Soft shadow rather than the chat overlay's hard four-offset outline: the
       panel already carries the contrast, and this stays legible if the panel
       is turned all the way down. */
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6), 0 0 14px rgba(0, 0, 0, 0.4);
  }

  /* The panel is the cover art, blurred: the card takes on the colour of
     whatever is playing instead of being a grey box.

     Both layers are blurred as whole elements rather than blurred inside a clip,
     which is the difference between a soft panel and a rough one — the blur
     carries their own edges outward into transparency, so the panel dissolves
     into the video with no boundary anywhere. The blur radius stays under the
     16px margin the body leaves, so the browser source never slices the falloff
     back into a straight line. */
  #np::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -2;
    border-radius: inherit;
    background: var(--cover, none) center / cover no-repeat;
    filter: blur(14px) saturate(1.6);
    opacity: calc(var(--panel) * 0.95);
  }

  /* Scrim over it: keeps text legible whatever the artwork looks like, and is
     the whole panel when there is no artwork. Blurred to the same radius so the
     two edges fade together. */
  #np::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    border-radius: inherit;
    background: linear-gradient(
      100deg,
      rgba(8, 8, 10, calc(var(--panel) * 1.1)),
      rgba(8, 8, 10, calc(var(--panel) * 0.85)));
    filter: blur(14px);
  }

  #np.show { display: flex; }
  #np.paused { opacity: 0.72; }
  /* Paused and left that way: the card has nothing to say, so it gets out of
     the shot. Later than .paused on purpose — same specificity, this one wins. */
  #np.idle { opacity: 0; }

  #art {
    width: var(--art);
    height: var(--art);
    flex: none;
    object-fit: cover;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
  }

  #art.hide { display: none; }

  .meta {
    min-width: 0;
    flex: 1;
  }

  .title {
    font-size: 1.25em;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -0.015em;
  }

  .artist {
    font-size: 0.9em;
    font-weight: 600;
    line-height: 1.35;
    color: rgba(255, 255, 255, 0.88);
  }

  .album {
    font-size: 0.68em;
    font-weight: 600;
    line-height: 1.5;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.62);
  }

  /* One line each: a browser source has a fixed width and a wrapping title
     would shove the progress bar out of frame. Anything too long to fit
     scrolls back and forth, or is cut with an ellipsis when scrolling is off. */
  .line {
    overflow: hidden;
    white-space: nowrap;
  }

  .line > span {
    display: inline-block;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .line.scroll > span {
    max-width: none;
    animation: marquee var(--dur, 8s) linear infinite alternate;
  }

  /* Dwell at both ends (with alternate) so the text is readable when it lands,
     rather than sliding continuously. */
  @keyframes marquee {
    0%, 15%   { transform: none; }
    85%, 100% { transform: translateX(calc(-1 * var(--over, 0px))); }
  }

  @media (prefers-reduced-motion: reduce) {
    .line.scroll > span { animation: none; }
  }

  .bar {
    margin-top: 10px;
    height: 4px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.14);
    overflow: hidden;
  }

  .fill {
    height: 100%;
    width: 0;
    border-radius: inherit;
    background: rgba(255, 255, 255, 0.9);
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
  }

  .times {
    display: flex;
    justify-content: space-between;
    margin-top: 5px;
    font-size: 0.62em;
    font-weight: 600;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    color: rgba(255, 255, 255, 0.72);
  }

  .progress.hide { display: none; }
</style>
</head>
<body>
<div id="np">
  <img id="art" alt="">
  <div class="meta">
    <div class="line title"><span></span></div>
    <div class="line artist"><span></span></div>
    <div class="line album"><span></span></div>
    <div class="progress">
      <div class="bar"><div class="fill"></div></div>
      <div class="times"><span class="elapsed"></span><span class="total"></span></div>
    </div>
  </div>
</div>
<script>
(() => {
  "use strict";

  // ?bg=<css-color> fills the normally-transparent background, for previewing
  // in a plain browser tab instead of OBS. Everything else is a setting the
  // server pushes, so OBS never needs the URL edited.
  const bg = new URLSearchParams(location.search).get("bg");
  if (bg) document.body.style.background = bg;

  // Keys and defaults match config.NowPlayingOptions' JSON.
  const defaults = {
    enabled: true, art: 96, font: 20, opacity: 45, progress: true, scroll: true,
  };
  let cfg = { ...defaults };

  const np = document.getElementById("np");
  const img = document.getElementById("art");
  const lines = [...np.querySelectorAll(".line")];
  const [title, artist, album] = lines;
  const prog = np.querySelector(".progress");
  const fill = np.querySelector(".fill");
  const elapsed = np.querySelector(".elapsed");
  const total = np.querySelector(".total");

  // The server polls the player about once a second; the page runs the clock
  // between updates from the last known position so the bar moves smoothly.
  // trackKey is the song itself: the position updates every second, and
  // re-rendering the text on those would restart the scroll animation forever.
  let track = null, since = 0, trackKey = "";

  // How long a paused player stays on screen before the card fades away.
  const IDLE_MS = 5000;
  let idleTimer = 0;

  function mmss(s) {
    s = Math.max(0, Math.floor(s));
    const m = Math.floor(s / 60);
    return m + ":" + String(s % 60).padStart(2, "0");
  }

  function tick() {
    requestAnimationFrame(tick);
    if (!track || !track.duration) return;
    let pos = track.position;
    if (track.playing) pos += (performance.now() - since) / 1000;
    pos = Math.min(pos, track.duration);
    fill.style.width = (pos / track.duration) * 100 + "%";
    elapsed.textContent = mmss(pos);
  }
  requestAnimationFrame(tick);

  // fit starts a line scrolling when its text is wider than the source: --over
  // is how far it has to travel, --dur paces that at a readable ~40px a second
  // plus the dwell at each end. The card must already be visible — a hidden
  // element measures as zero-width and would never scroll.
  function fit(el) {
    el.classList.remove("scroll"); // measure untransformed and unclamped
    if (!cfg.scroll) return;
    const over = el.firstElementChild.scrollWidth - el.clientWidth;
    if (over <= 1) return;
    el.style.setProperty("--over", over + "px");
    el.style.setProperty("--dur", (over / 40 + 4).toFixed(1) + "s");
    el.classList.add("scroll");
  }

  // meta renders the song itself. Only called when the song (or the layout)
  // changed, so the scroll animation runs uninterrupted in between.
  function meta(t) {
    const text = [t.title, t.artist, t.album];
    lines.forEach((el, i) => {
      // textContent only: track metadata is whatever a file's tags say.
      el.firstElementChild.textContent = text[i] || "";
      el.style.display = text[i] ? "" : "none";
    });
    // The same artwork backs the panel, blurred (--cover); quotes and
    // backslashes are escaped so a path can't break out of the url() string.
    if (t.art) {
      np.style.setProperty("--cover",
        'url("' + t.art.replace(/[\\"]/g, "\\$&").replace(/[\n\r]/g, "") + '")');
    } else {
      np.style.removeProperty("--cover");
    }
    if (t.art && cfg.art > 0) {
      img.src = t.art;
      img.classList.remove("hide");
    } else {
      img.classList.add("hide");
      img.removeAttribute("src");
    }
    lines.forEach(fit);
  }

  function show(t) {
    if (!cfg.enabled || !t || !t.title) {
      clearTimeout(idleTimer);
      np.classList.remove("show", "idle");
      track = null;
      trackKey = "";
      return;
    }
    track = t;
    since = performance.now();
    np.classList.toggle("paused", !t.playing);
    // Any update wakes the card; if it's paused, it fades out again after
    // IDLE_MS. The server only sends changes, so a paused player sends nothing
    // and the timer runs out — but scrubbing while paused brings it back.
    np.classList.remove("idle");
    clearTimeout(idleTimer);
    if (!t.playing) idleTimer = setTimeout(() => np.classList.add("idle"), IDLE_MS);
    np.classList.add("show"); // before meta(): fit() measures a visible card

    const key = [t.title, t.artist, t.album, t.art].join("|");
    if (key !== trackKey) {
      trackKey = key;
      meta(t);
    }

    // Duration 0 means the player didn't report one (a live stream, some web
    // players): drop the bar rather than show a meaningless full one.
    prog.classList.toggle("hide", !cfg.progress || !t.duration);
    total.textContent = t.duration ? mmss(t.duration) : "";
  }

  function applySettings() {
    const root = document.documentElement.style;
    root.setProperty("--art", Math.max(0, cfg.art) + "px");
    root.setProperty("--font", Math.max(8, cfg.font) + "px");
    root.setProperty("--panel", Math.min(100, Math.max(0, cfg.opacity)) / 100);
    // Sizes changed, so what fits changed: re-render the current song.
    trackKey = "";
    show(track);
  }

  // Resizing the browser source changes what fits, too.
  addEventListener("resize", () => lines.forEach(fit));

  const es = new EventSource("/events");
  es.addEventListener("now_playing_settings", (ev) => {
    try { cfg = { ...defaults, ...JSON.parse(ev.data) }; } catch { return; }
    applySettings();
  });
  es.addEventListener("now_playing", (ev) => {
    try { show(JSON.parse(ev.data)); } catch {}
  });
})();
</script>
</body>
</html>
